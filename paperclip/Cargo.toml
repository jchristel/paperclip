[package]
name = "paperclip"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
lopdf = "0.40"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
indicatif = "0.17"
csv = "1"
regex = "1"
chrono = "0.4"
walkdir = "2.5.0"
colored = "2"
flate2 = "1"        # deflate/zlib compression for the XMP metadata stream

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Security_Credentials",  # CredWriteW, CredReadW, CredFree
    "Win32_Foundation",            # TRUE, FALSE, GetLastError
]
